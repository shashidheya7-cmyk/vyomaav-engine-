profile_name: video_scene
hardware:
  device: cuda
  precision: fp16
  vram_budget_gb: 80.0
ingestion:
  max_video_frames: 600
  target_fps: 24.0
perception:
  depth_model: depth_anything_v2_vitl
  segmentation_model: sam2_hiera_large
  tracking_model: bytetrack
camera_geometry:
  geometry_backend: mast3r
  colmap_enabled: true
fusion:
  evidence_weight: 0.95
  generative_prior_weight: 0.05
texture_material:
  texture_resolution: 4096
validation:
  min_overall_confidence: 0.7
storage:
  workspace_root: workspace
