profile_name: blackwell_rtx6000
hardware:
  device: cuda
  precision: fp16
  vram_budget_gb: 85.0
  reserve_headroom_gb: 6.0
  cuda_device_index: 0
ingestion:
  max_resolution: [3840, 2160]
  max_video_frames: 1200
  target_fps: 30.0
perception:
  depth_model: depth_anything_v2_vitl
  segmentation_model: sam2_hiera_large
  tracking_model: bytetrack
  batch_size: 16
camera_geometry:
  geometry_backend: mast3r
  colmap_enabled: true
  bundle_adjustment_iterations: 150
workers_3d:
  primary_worker: TRELLIS
  sparse_steps: 16
  slat_steps: 16
fusion:
  evidence_weight: 0.85
  generative_prior_weight: 0.15
  confidence_floor: 0.4
texture_material:
  texture_resolution: 4096
  bake_with_nvdiffrast: true
refinement:
  target_face_count: 50000
  manifold_repair_enabled: true
  qem_decimation_enabled: true
validation:
  min_overall_confidence: 0.7
  max_reprojection_error_pixels: 2.0
storage:
  workspace_root: workspace
  auto_generate_manifests: true
