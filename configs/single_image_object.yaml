profile_name: single_image_object
hardware:
  device: cuda
  precision: fp16
  vram_budget_gb: 40.0
ingestion:
  max_resolution: [2048, 2048]
perception:
  depth_model: depth_anything_v2_vitl
  segmentation_model: sam2_hiera_large
  foreground_threshold: 0.5
workers_3d:
  primary_worker: TRELLIS
  sparse_steps: 12
  slat_steps: 12
fusion:
  evidence_weight: 0.70
  generative_prior_weight: 0.30
texture_material:
  texture_resolution: 2048
refinement:
  target_face_count: 30000
validation:
  min_overall_confidence: 0.6
storage:
  workspace_root: workspace
