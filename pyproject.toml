[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vyomaa-engine"
version = "0.3.2"
description = "Canonical AI 3D Reconstruction and Geometric Evidence Engine"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }

dependencies = [
    "numpy>=1.26.0,<2.2.0",
    "scipy>=1.13.0",
    "opencv-python>=4.9.0",
    "Pillow>=10.0.0",
    "PyYAML>=6.0.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0"
]

perception = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=4.45.0",
    "accelerate>=0.34.0",
    "sam2"
]

geometry = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "einops>=0.8.0",
    "kornia>=0.7.3",
    "dust3r",
    "mast3r"
]

triposr = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "diffusers>=0.30.0",
    "trimesh>=4.4.0",
    "einops>=0.8.0"
]

trellis = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "trimesh>=4.4.0",
    "spconv-cu120>=2.3.6",
    "nvdiffrast",
    "xformers"
]

hunyuan3d = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "diffusers>=0.30.0",
    "trimesh>=4.4.0",
    "xatlas>=0.0.9",
    "hy3dgen"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vyomaa*"]
exclude = [
    "tests*",
    "workspace*",
    "models*",
    "weights*",
    "checkpoints*",
    "reports*"
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
